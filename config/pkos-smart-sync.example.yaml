pkos_smart_sync:
  enabled: true
  repository_path: C:/Users/stanv/OneDrive/Documents/Obsidian Vault
  lint_command:
    - python
    - 07-tools/lint_wiki.py
  auto_stage_classifications:
    - production_knowledge
    - governed_operations
    - tooling
  review_classifications:
    - approved_research
    - draft_research
    - configuration
    - unknown
  excluded_classifications:
    - generated_output
    - runtime_artifact
    - temporary_file
    - private_or_secret
  require_confirmation: true
  allow_commit: true
  allow_push: true
  push_requires_confirmation: true
  remote: origin
  branch: main
  include_rules: []
  exclude_rules: []
  overrides:
    - pattern: "03-operations/aoc/07-automation/intake/incoming/**"
      classification: runtime_artifact
      action: exclude
      priority: 100
    - pattern: "03-operations/aoc/07-automation/intake/review/**"
      classification: runtime_artifact
      action: exclude
      priority: 100
    - pattern: "03-operations/aoc/07-automation/tmp/**"
      classification: runtime_artifact
      action: exclude
      priority: 100
    - pattern: "03-operations/aoc/07-automation/temp/**"
      classification: runtime_artifact
      action: exclude
      priority: 100
    - pattern: "03-operations/aoc/07-automation/cache/**"
      classification: runtime_artifact
      action: exclude
      priority: 100
    - pattern: "03-operations/aoc/07-automation/locks/**"
      classification: runtime_artifact
      action: exclude
      priority: 100
    - pattern: "03-operations/aoc/07-automation/intake/approved/**"
      classification: governed_operations
      action: stage
      priority: 90
    - pattern: "03-operations/aoc/00-system/**"
      classification: governed_operations
      action: stage
      priority: 80
    - pattern: "03-operations/aoc/01-dashboard/**"
      classification: governed_operations
      action: stage
      priority: 80
    - pattern: "03-operations/aoc/02-assignments/**"
      classification: governed_operations
      action: stage
      priority: 80
    - pattern: "03-operations/aoc/05-knowledge/packs/**"
      classification: governed_operations
      action: stage
      priority: 80
    - pattern: "03-operations/aoc/08-analytics/friction/**"
      classification: governed_operations
      action: stage
      priority: 80
    - pattern: "03-operations/aoc/07-automation/opportunities/review/**"
      classification: unknown
      action: review
      priority: 70
    - pattern: "03-operations/aoc/**"
      classification: unknown
      action: review
      priority: 10
    - pattern: "08-research/**"
      classification: draft_research
      action: review
      priority: 90
    - pattern: ".obsidian/**"
      classification: configuration
      action: review
      priority: 90
    - pattern: "**/intake/incoming/**"
      classification: runtime_artifact
      action: exclude
      priority: 100
