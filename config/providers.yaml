providers:
  - id: codex
    enabled: true
    role: default_v1_execution_environment
    capabilities:
      - reasoning
      - file_inspection
      - file_editing
      - shell_execution
      - structured_output
  - id: openai
    enabled: false
    role: future_model_provider
    capabilities:
      - reasoning
      - structured_output
      - multimodal_understanding
  - id: anthropic
    enabled: false
    role: future_model_provider
    capabilities:
      - reasoning
      - structured_output
  - id: google
    enabled: false
    role: future_model_provider
    capabilities:
      - reasoning
      - structured_output
      - multimodal_understanding
  - id: local
    enabled: false
    role: future_local_model_provider
    capabilities:
      - reasoning
      - structured_output
  - id: echo
    enabled: true
    role: deterministic_stub_provider
    provider_type: echo
    model: echo-v0
    capabilities:
      - reasoning
      - structured_output
  - id: "null"
    enabled: true
    role: deterministic_noop_provider
    provider_type: "null"
    model: null-v0
    capabilities:
      - reasoning
      - structured_output
  - id: failure
    enabled: false
    role: deterministic_failure_provider
    provider_type: failure
    model: failure-v0
    capabilities:
      - reasoning
      - structured_output

routing:
  strategy: capability_based
  fallback_policy: require_human_confirmation
  invoke_provider_during_kernel_run: false
  default_provider: null
